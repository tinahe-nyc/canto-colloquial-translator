<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapok Club</title>
<meta name="theme-color" content="#f4f2ed">
<meta name="apple-mobile-web-app-title" content="Kapok Club">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ed; --card: #fffdf8; --ink: #1d1b19; --soft: #6b655e;
    --mint: #9ecfb9; --tan: #e3c07f; --coral: #e8806c; --blue: #8fa3d6; --pink: #f0a7a0;
    --mint-soft: #e3f1ea; --tan-soft: #f7ecd4; --coral-soft: #fbe3dc; --blue-soft: #e5eaf7;
    --line: 2.5px solid var(--ink);
    --wob: 22px 14px 20px 12px / 14px 20px 12px 22px;
    --wob2: 14px 22px 12px 20px / 20px 12px 22px 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1c1a; --card: #282522; --ink: #f2ece2; --soft: #b7ada2;
      --mint-soft: #26362f; --tan-soft: #3a3224; --coral-soft: #3d2925; --blue-soft: #262c3c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Nunito, system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 90px; }
  h1, h3, .hand, button, label.small, .chip { font-family: Gaegu, 'Comic Sans MS', cursive; }
  h1 { font-size: 34px; line-height: 1; margin: 0; font-weight: 700; }
  h1 span { color: var(--coral); }
  .hero { display: flex; align-items: center; gap: 6px; margin: 4px 0 14px; }
  .hero svg { width: 80px; height: 80px; flex: none; }
  .brand-flower { display: block; height: auto; flex: none; border-radius: 18%; }
  .hero .brand-flower { width: 76px; margin-right: 8px; }
  .tagline { margin: 4px 0 0; font: 700 23px/1.1 Gaegu, 'Comic Sans MS', cursive; }
  .sub { color: var(--soft); margin: 6px 0 0; font-size: 15px; }
  .card { background: var(--card); border: var(--line); border-radius: var(--wob); padding: 16px; margin-bottom: 18px; position: relative; }
  label.small { display: block; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { border: 2px solid var(--ink); background: var(--card); color: var(--ink); border-radius: var(--wob2); padding: 3px 13px; font-size: 19px; cursor: pointer; transition: transform .12s; }
  .chip:active { transform: scale(.95) rotate(-2deg); }
  .chip.on { background: var(--tan); color: #1d1b19; box-shadow: -3px 3px 0 var(--tan-soft); transform: rotate(-1.5deg); }
  textarea, input[type=text] { width: 100%; border: var(--line); border-radius: var(--wob2); padding: 12px; font: inherit; background: var(--bg); color: var(--ink); resize: vertical; }
  textarea:focus, input:focus { outline: none; box-shadow: -4px 4px 0 var(--mint); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { font-size: 21px; font-weight: 700; cursor: pointer; color: #1d1b19; transition: transform .12s, box-shadow .12s; }
  button.main { flex: 1; min-width: 160px; background: var(--coral); border: var(--line); border-radius: var(--wob); padding: 8px 16px; box-shadow: -5px 4px 0 var(--pink); }
  button.main:active, button.ghost:active, .play button:active { transform: translate(-2px, 2px); box-shadow: none; }
  button.main:disabled { opacity: .7; cursor: wait; }
  button.ghost { background: var(--card); color: var(--ink); border: var(--line); border-radius: var(--wob2); padding: 6px 14px; }
  button.ghost.rec { background: var(--coral-soft); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.05) rotate(1deg); } }
  details summary { cursor: pointer; color: var(--soft); font-size: 15px; }
  details textarea { margin-top: 8px; }
  .hint { font-size: 14px; color: var(--soft); margin-top: 6px; }
  .err { color: var(--coral); font-weight: 700; font-size: 15px; margin-top: 8px; }
  .loading { text-align: center; padding: 18px 10px 22px; overflow: hidden; }
  .loading .msg { font-family: Gaegu, cursive; font-size: 24px; font-weight: 700; }
  .crawl { width: 90px; height: 70px; animation: crawl 6s ease-in-out infinite alternate; }
  @keyframes crawl { from { transform: translateX(-90px); } to { transform: translateX(90px); } }
  .dots::after { content: ''; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0% { content: '' } 25% { content: '.' } 50% { content: '..' } 75% { content: '...' } }

  .result { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { transform: scale(.94) rotate(-1deg); opacity: 0; } }
  .bubble { background: var(--mint-soft); border: var(--line); border-radius: var(--wob); padding: 14px 16px; position: relative; }
  .line { font-family: 'Noto Sans SC', sans-serif; font-size: 27px; line-height: 1.5; margin: 0; font-weight: 500; }
  .jp { color: #2b7a62; font-weight: 700; font-size: 16px; margin: 4px 0 0; }
  @media (prefers-color-scheme: dark) { .jp { color: var(--mint); } }
  .back { color: var(--soft); font-style: italic; font-size: 15px; margin-top: 10px; }
  .play { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
  .play button { font-size: 18px; background: var(--mint); border: var(--line); border-radius: var(--wob2); padding: 3px 11px; box-shadow: -4px 3px 0 var(--mint-soft); }
  .play button:disabled { opacity: .7; }
  h3 { font-size: 24px; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  h3 svg { width: 44px; height: 44px; }
  h3 .hint { font-family: Nunito, sans-serif; font-size: 13px; margin: 0; }
  .words { display: flex; flex-wrap: wrap; gap: 9px; }
  .w { border: 2px solid var(--ink); border-radius: var(--wob2); padding: 6px 10px; text-align: center; cursor: pointer; background: var(--card); min-width: 58px; transition: transform .12s; }
  .w:nth-child(4n+1) { background: var(--tan-soft); } .w:nth-child(4n+2) { background: var(--blue-soft); }
  .w:nth-child(4n+3) { background: var(--mint-soft); } .w:nth-child(4n) { background: var(--coral-soft); }
  .w:nth-child(odd) { transform: rotate(-1deg); } .w:nth-child(even) { transform: rotate(1deg); }
  .w:active { transform: scale(.93); }
  .w .j { color: #2b7a62; font-weight: 700; font-size: 13px; }
  @media (prefers-color-scheme: dark) { .w .j { color: var(--mint); } }
  .w .h { font-family: 'Noto Sans SC', sans-serif; font-size: 21px; }
  .w .m { color: var(--soft); font-size: 12px; max-width: 130px; }
  .w .d { color: #a0651a; font-size: 11px; }
  .note { background: var(--card); border: 2px solid var(--ink); border-radius: var(--wob2); padding: 10px 12px; margin-bottom: 10px; box-shadow: -4px 3px 0 var(--tan); }
  .note:nth-child(even) { box-shadow: -4px 3px 0 var(--blue); }
  .note .q { font-weight: 800; font-size: 14px; }
  .note .q .zh { font-family: 'Noto Sans SC', sans-serif; font-weight: 500; }
  .note p { margin: 4px 0 0; font-size: 15px; }
  .tip { display: flex; gap: 10px; align-items: center; background: var(--blue-soft); border: var(--line); border-radius: var(--wob); padding: 10px 12px; font-size: 15px; margin-top: 18px; }
  .tip svg { width: 52px; height: 52px; flex: none; }
  .alt { background: var(--tan-soft); border: 2px dashed var(--ink); border-radius: var(--wob2); padding: 12px; }
  .alt .line { font-size: 22px; }
  .hist { list-style: none; padding: 0; margin: 0; }
  .hist li { padding: 10px 0; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 25%, transparent); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .en { font-size: 14px; color: var(--soft); }
  .hist .zh { font-family: 'Noto Sans SC', sans-serif; }
  .hist .x { color: var(--soft); background: none; border: 0; font-size: 22px; padding: 0 4px; }
  .gate { max-width: 360px; margin: 40px auto; text-align: center; }
  .gate .brand-flower { width: 112px; margin: 0 auto 10px; }
  .flash { text-align: center; padding: 22px 16px; }
  .flash .mascot { width: 84px; height: 84px; }
  .flash .prompt { font-family: Gaegu, cursive; font-size: 28px; font-weight: 700; line-height: 1.2; margin: 6px 0; }
  .yay { animation: yay .6s ease; }
  @keyframes yay { 30% { transform: translateY(-14px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
  .streak { display: inline-block; background: var(--tan); color: #1d1b19; border: 2px solid var(--ink); border-radius: var(--wob2); padding: 0 10px; font-family: Gaegu, cursive; font-weight: 700; font-size: 18px; transform: rotate(-2deg); }

  button.ghost.guide-btn { width: 100%; margin: 0 0 18px; background: var(--blue-soft); font-size: 20px; text-align: left; }
  .tonechart { width: 100%; height: auto; display: block; }
  .tonechart text { font-family: Gaegu, cursive; font-weight: 700; fill: var(--ink); }
  .tonechart .tl { fill: none; stroke-width: 7; stroke-linecap: round; filter: url(#wob); cursor: pointer; }
  .tonechart .tl.on { stroke-width: 11; }
  .tonechart .grid { stroke: var(--ink); stroke-opacity: .15; stroke-width: 2; stroke-dasharray: 4 7; }
  .tones { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tone { border: 2px solid var(--ink); border-radius: var(--wob2); padding: 8px 10px; cursor: pointer; background: var(--card); transition: transform .12s; }
  .tone:active { transform: scale(.95); }
  .tone .n { font-family: Gaegu, cursive; font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 6px; }
  .tone .sw { width: 22px; height: 8px; border-radius: 4px; border: 1.5px solid var(--ink); }
  .tone .ex { font-family: 'Noto Sans SC', sans-serif; font-size: 22px; }
  .tone .ex small { font-family: Nunito, sans-serif; font-size: 13px; color: var(--soft); }
  .cheat { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  .cheat td { padding: 8px 10px; background: var(--card); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); vertical-align: top; font-size: 15px; }
  .cheat td:first-child { border-left: 2px solid var(--ink); border-radius: 14px 0 0 12px; font-family: Gaegu, cursive; font-weight: 700; font-size: 24px; color: #2b7a62; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .cheat td:first-child { color: var(--mint); } }
  .cheat td:last-child { border-right: 2px solid var(--ink); border-radius: 0 12px 14px 0; cursor: pointer; white-space: nowrap; }
  .cheat .zh { font-family: 'Noto Sans SC', sans-serif; font-size: 18px; }
  .pair { background: var(--tan-soft); border: 2px solid var(--ink); border-radius: var(--wob); padding: 10px 12px; margin-bottom: 10px; }
  .pair b { font-family: Gaegu, cursive; font-size: 20px; }
  .mini { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .mini button { font-size: 17px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: var(--wob2); padding: 1px 10px; }
  .voicewarn { background: var(--coral-soft); border: 2px dashed var(--ink); border-radius: var(--wob2); padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  button.ghost.altsbtn { display: flex; align-items: center; gap: 4px; background: var(--tan-soft); }
  button.ghost.altsbtn svg { width: 38px; height: 38px; }
  .pausebtn { color: var(--ink) !important; background: var(--card) !important; box-shadow: none !important; opacity: .8; }
  .pausebtn.live { opacity: 1; color: #1d1b19 !important; background: var(--tan) !important; }
  .alt { margin-bottom: 14px; }
  .altlabel { font-family: Gaegu, cursive; font-weight: 700; font-size: 21px; margin-bottom: 2px; }
  .breakdown { margin-top: 10px; }
  .breakdown summary { font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: var(--wob2); padding: 3px 12px; display: inline-block; list-style: none; }
  .breakdown summary::-webkit-details-marker { display: none; }
  .breakdown[open] summary { background: var(--tan); }
  .sublabel { font-family: Gaegu, cursive; font-weight: 700; font-size: 19px; margin: 12px 0 8px; }
  /* hand-drawn wobble for the doodles */
  .doodle .ink { fill: none; stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#wob); }
  .doodle .dot { fill: var(--ink); stroke: none; }
  .wave { transform-origin: 76px 56px; animation: wave 1.6s ease-in-out infinite; }
  @keyframes wave { 50% { transform: rotate(-14deg); } }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  @keyframes steam { 50% { transform: translateY(-3px); opacity: .5; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wob" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="400"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div class="wrap" id="app"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('canto:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('canto:' + k, JSON.stringify(v)); } catch {} },
};

// ---------- Doodles (hand-drawn style: pastel fill printed a little off, wobbly ink on top) ----------
const svg = (body, cls = '') => `<svg class="doodle ${cls}" viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
const D = {
  blob: (c = '') => svg(`
    <path d="M30 82 C16 58 20 24 50 21 C80 24 84 58 72 82 Z" fill="var(--coral)" transform="translate(-4 3)"/>
    <g class="ink"><path d="M30 82 C16 58 20 24 50 21 C80 24 84 58 72 82 Z"/>
      <path d="M40 82 V93 H33"/><path d="M62 82 V93 H69"/><path d="M27 58 Q19 64 23 73"/>
      <path d="M43 60 Q51 67 59 60"/>
      <g class="wave"><path d="M76 56 Q86 46 88 34"/><circle cx="89" cy="29" r="4.5"/><path d="M95 20 l5 -4"/><path d="M96 30 l6 0"/></g></g>
    <circle class="dot" cx="42" cy="47" r="3.6"/><circle class="dot" cx="60" cy="47" r="3.6"/>`, c),
  frog: (c = '') => svg(`
    <g fill="var(--mint)" transform="translate(-3 3)"><path d="M14 80 C14 55 30 48 50 48 C70 48 86 55 86 80 Z"/><circle cx="33" cy="44" r="11"/><circle cx="67" cy="44" r="11"/></g>
    <ellipse cx="26" cy="66" rx="5" ry="3" fill="var(--pink)"/><ellipse cx="74" cy="66" rx="5" ry="3" fill="var(--pink)"/>
    <g class="ink"><path d="M15 80 C16 60 26 52 36 52 M64 52 C76 52 85 60 85 80"/><path d="M23 42 Q33 28 43 42"/><path d="M57 42 Q67 28 77 42"/>
      <path d="M36 52 Q50 48 64 52"/><path d="M40 63 Q50 70 60 63"/><path d="M8 81 H92"/><path d="M32 80 Q31 72 40 72"/><path d="M68 80 Q69 72 60 72"/></g>
    <circle class="dot" cx="33" cy="46" r="3.6"/><circle class="dot" cx="67" cy="46" r="3.6"/>`, c),
  cat: (c = '') => svg(`
    <path d="M30 92 V50 L28 16 L42 29 Q50 27 58 29 L72 16 L70 50 V92 Z" fill="var(--tan)" transform="translate(-4 2)"/>
    <g class="ink"><path d="M30 50 L28 16 L42 29 Q50 27 58 29 L72 16 L70 50 Q50 62 30 50 Z"/><path d="M33 56 V92 H67 V56"/>
      <path d="M45 80 V92"/><path d="M55 80 V92"/><path d="M67 88 Q86 92 84 72"/><path d="M46 46 L50 49 L54 46"/></g>
    <circle class="dot" cx="42" cy="40" r="3"/><circle class="dot" cx="58" cy="40" r="3"/>`, c),
  mug: (c = '') => svg(`
    <path d="M26 40 L30 92 H66 L70 40 Z" fill="var(--blue)" transform="translate(-4 3)"/>
    <g class="ink"><path d="M26 40 L30 92 H66 L70 40 Q48 34 26 40 Z"/><path d="M26 40 Q48 46 70 40"/><path d="M70 52 Q86 51 84 65 Q82 77 67 77"/>
      <g class="steam"><path d="M42 30 Q36 23 42 16 Q48 9 42 2"/><path d="M55 30 Q49 23 55 16 Q61 9 55 2"/></g></g>`, c),
  snail: (c = '') => svg(`
    <path d="M10 78 Q30 70 60 72 Q80 66 90 52 L94 79 Z" fill="var(--mint)" opacity=".8"/>
    <circle cx="44" cy="56" r="20" fill="var(--tan)" transform="translate(-3 2)"/>
    <g class="ink"><circle cx="44" cy="56" r="20"/><path d="M44 56 m0 -6 a6 6 0 1 1 -6 6 a11 11 0 0 1 11 -11 a15 15 0 0 1 15 15"/>
      <path d="M6 78 H82 Q91 70 88 52"/><path d="M88 52 L84 38"/><path d="M88 52 L97 41"/></g>
    <circle class="dot" cx="84" cy="36" r="3"/><circle class="dot" cx="98" cy="39" r="3"/>`, c),
};

const LOADING = ['Asking the aunties', 'Picking the comfiest words', 'Skipping the textbook version', 'Warming up the tones', 'Checking how a local says it'];
const LISTENERS = ['My parents', 'Family', 'Friends', 'Partner', 'Coworker', 'Shop or restaurant', 'Someone new'];
const LISTENER_IDS = ['parents', 'family', 'friends', 'partner', 'coworker', 'shop', 'stranger'];
const STARTERS = ['Have you eaten yet?', "I'm going home now.", "I'm tired."];

function phraseHistory() {
  const saved = store.get('history', null);
  if (Array.isArray(saved)) return saved;
  try {
    const legacy = JSON.parse(localStorage.getItem('kapok.phrasebook.v1')) || [];
    return legacy.flatMap((entry) => {
      const result = entry.results?.cantonese;
      if (!result) return [];
      return [{
        input: entry.english, listener: LISTENERS[LISTENER_IDS.indexOf(entry.listener)] || LISTENERS[0],
        level: entry.style || 'simple', ts: Date.parse(entry.savedAt) || 0,
        result: { ...result, lang: 'yue', source: entry.sources?.cantonese },
      }];
    });
  } catch { return []; }
}

let state = {
  authenticated: false, providerReady: false, demo: false, connecting: true,
  listener: store.get('listener', 'My parents'),
  about: store.get('about', ''),
  history: phraseHistory(),
  result: null, input: '', loading: false, error: '',
  level: store.get('level', 'simple'),
  view: 'main', deck: store.get('deck', 'lines'), mode: store.get('mode', 'say'), card: null, shown: false,
};
try { localStorage.removeItem('canto:code'); } catch {}

// Keep older entries intact and show the Cantonese line from previously paired lessons.
const isCantoneseEntry = (entry) => entry?.result && (entry.result.lang ?? 'yue') === 'yue';
const myHistory = () => state.history.map((h, i) => ({ h, i })).filter(({ h }) => isCantoneseEntry(h));

const audioCache = new Map();
let current;

async function speak(text, slow, btn) {
  const key = (slow ? 'slow:' : 'normal:') + text;
  try {
    if (current) current.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (!state.authenticated || !state.providerReady) {
      const voice = localVoice();
      if (!voice) throw new Error('Install a Cantonese voice on your device.');
      const line = new SpeechSynthesisUtterance(text);
      line.voice = voice;
      line.lang = voice.lang;
      line.rate = slow ? 0.65 : 0.9;
      line.onstart = line.onend = line.onpause = line.onresume = syncPause;
      speechSynthesis.speak(line);
      return;
    }
    let url = audioCache.get(key);
    if (!url) {
      if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'Loading voice…'; }
      const r = await fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, slow, language: 'cantonese' }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'voice failed');
      url = URL.createObjectURL(await r.blob());
      audioCache.set(key, url);
    }
    current = new Audio(url);
    current.onplay = current.onpause = current.onended = syncPause;
    await current.play();
  } catch (e) {
    alert('Could not play the voice: ' + e.message);
  } finally {
    if (btn && btn.dataset.label) { btn.disabled = false; btn.textContent = btn.dataset.label; }
  }
}

// One pause button per play row; they all control whatever is playing right now.
function isPlaying() { return (current && !current.paused && !current.ended) || (window.speechSynthesis && speechSynthesis.speaking && !speechSynthesis.paused); }
function isPaused() { return (current && current.paused && !current.ended && current.currentTime > 0) || (window.speechSynthesis && speechSynthesis.paused); }
function syncPause() {
  document.querySelectorAll('[data-pause]').forEach((b) => {
    b.textContent = isPaused() ? '▶ Resume' : '❚❚ Pause';
    b.classList.toggle('live', isPlaying() || isPaused());
  });
}
function togglePause() {
  if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.paused)) {
    speechSynthesis.paused ? speechSynthesis.resume() : speechSynthesis.pause();
  } else if (current) {
    current.paused ? current.play() : current.pause();
  }
  setTimeout(syncPause, 50);
}
const PAUSE = '<button data-pause class="pausebtn">❚❚ Pause</button>';
document.addEventListener('click', (e) => { if (e.target.closest('[data-pause]')) togglePause(); });

function render() {
  const app = $('#app');
  if (state.connecting) { app.innerHTML = '<div class="gate">Opening the coach…</div>'; return; }
  const canEnter = state.authenticated || state.demo;
  if (canEnter && state.view === 'practice') return renderPractice(app);
  if (canEnter && state.view === 'guide') return renderGuide(app);
  if (!canEnter) {
    app.innerHTML = `

async function post(body) {
  const r = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Something went wrong. Try again?' }));
  if (r.status === 401 && body.action === 'coach') { state.authenticated = false; state.demo = false; }
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}

async function api(body, starter) {
  if (!starter) return post({ action: 'coach', ...body });
  const action = body.mode === 'alts' ? 'starter-alternatives' : 'starter';
  const data = await post({ action, english: body.text, language: 'cantonese' });
  if (body.mode === 'alts') return { alts: data.alternatives };
  return { ...data.result, lang: 'yue', source: data.source };
}

// "Show other ways" is fetched only on request, which keeps each translation about half the price.
async function loadAlts(r) {
  r._altsLoading = true; r._altsError = ''; render();
  const h = state.history.find((x) => x.result === r);
  try {
    const j = await api({ mode: 'alts', text: h ? h.input : state.input, listener: h ? h.listener : state.listener, about: state.about, level: h?.level || state.level, main: r.hanzi }, r.source === 'starter');
    r.alts = j.alts;
  } catch (e) {
    r._altsError = e.message;
  } finally {
    r._altsLoading = false; store.set('history', state.history); render();
  }
}

function wireResult(root) {
  root.querySelectorAll('[data-say]').forEach((el) => el.onclick = () => speak(el.dataset.say, !!el.dataset.slow, el.tagName === 'BUTTON' ? el : null));
  const alternatives = root.querySelector('#show-alternatives');
  if (alternatives) alternatives.onclick = () => loadAlts(state.result);
}

async function translate(starter = false) {
  if (state.loading) return;
  const text = $('#en').value.trim();
  if (!text) { state.error = 'Type or say something first.'; render(); return; }
  if (!starter && (!state.authenticated || !state.providerReady)) {
    state.error = state.authenticated ? 'Custom translations are offline. Choose a built-in sample.' : 'Enter the friends passcode to request a custom translation.';
    render();
    return;
  }
  state.input = text; state.loading = true; state.error = ''; render();
  const base = { text, listener: state.listener, about: state.about, level: state.level };
  try {
    const result = await api(base, starter);
    state.result = result; state.fresh = true;
    state.history.unshift({ input: text, listener: base.listener, level: base.level, result, ts: Date.now() });
    let cantoneseCount = 0;
    state.history = state.history.filter((entry) => !isCantoneseEntry(entry) || ++cantoneseCount <= 200);
    store.set('history', state.history);
  } catch (e) {
    state.error = e.message;
  } finally {
    state.loading = false; render();
  }
}

function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice typing isn\'t supported in this browser. Try the microphone key on your keyboard instead.'); return; }
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
  const btn = $('#mic'), box = $('#en'), before = box.value ? box.value.trim() + ' ' : '';
  btn.classList.add('rec'); btn.textContent = '● Listening…';
  rec.onresult = (e) => { box.value = before + Array.from(e.results).map((r) => r[0].transcript).join(''); state.input = box.value; };
  rec.onend = () => { btn.classList.remove('rec'); btn.textContent = '🎙 Speak'; };
  rec.onerror = () => rec.onend();
  rec.start();
}


// ---------- Flashcards ----------
// Cards come from the phrasebook: whole lines, or the words inside them. Progress is a simple
// Leitner box per card and mode, saved on this phone: "Got it" moves a card up a box (seen less often), "Again" back to the start.
const DAYS = [0, 1, 3, 7, 16, 35];
const DAY = 864e5;
let progress = store.get('srs', {});

function cards() {
  const seen = new Set(), out = [];
  for (const { h } of myHistory()) {
    const r = h.result;
    if (state.deck === 'lines') {
      if (seen.has(r.hanzi)) continue;
      seen.add(r.hanzi);
      out.push({ id: 'l:' + r.hanzi, hanzi: r.hanzi, say: r.trad || r.hanzi, jyutping: r.jyutping, en: h.input, sub: 'To: ' + h.listener, back: r.back });
    } else {
      for (const w of r.words || []) {
        if (!/[㐀-鿿]/.test(w.hanzi) || seen.has(w.hanzi)) continue;
        seen.add(w.hanzi);
        out.push({ id: 'w:' + w.hanzi, hanzi: w.hanzi, say: w.trad || w.hanzi, jyutping: w.jyutping, en: w.meaning, sub: 'From: ' + r.hanzi, back: '' });
      }
    }
  }
  return out;
}
const key = (c) => state.mode + '|' + c.id;
const prog = (c) => progress[key(c)] || { box: 0, due: 0, isNew: true };

function nextCard(anyway) {
  const all = cards(), now = Date.now();
  const due = all.filter((c) => prog(c).due <= now).sort((a, b) => prog(a).due - prog(b).due);
  if (due.length) return due[0];
  if (anyway && all.length) return all[Math.floor(Math.random() * all.length)];
  return null;
}

function rate(c, how) {
  const p = prog(c);
  const box = how === 'again' ? 0 : how === 'hard' ? Math.max(1, p.box) : Math.min(DAYS.length - 1, p.box + 1);
  const due = how === 'again' ? Date.now() + 60e3 : Date.now() + DAYS[box] * DAY;
  progress[key(c)] = { box, due };
  store.set('srs', progress);
}

function doneToday() { const d = store.get('done', {}); return d.day === new Date().toDateString() ? d.n : 0; }

    <div class="chips">${tog('deck', 'lines', 'Sentences')}${tog('deck', 'words', 'Words')}</div>

  if ($('#hearslow')) $('#hearslow').onclick = (e) => speak(c.say, true, e.currentTarget);
  app.querySelectorAll('[data-rate]').forEach((b) => b.onclick = () => {
    rate(c, b.dataset.rate);
    const today = new Date().toDateString(), d = store.get('done', {});
    store.set('done', { day: today, n: (d.day === today ? d.n : 0) + 1 });

// ---------- Jyutping 101 ----------
// Tone samples use the device's own voice (dictionary-based, so single syllables get the right tone).
// The AI voice is great for sentences but unreliable on lone syllables.
function localVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  return vs.find((v) => /yue|zh[-_]HK/i.test(v.lang)) || vs.find((v) => /cantonese|粤|粵|sinji/i.test(v.name));
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (state.view === 'guide') render(); };
function sayLocal(text, rate = 0.75) {
  const v = localVoice();
  if (!v) { speak(text, true); return; }
  if (current) current.pause();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang; u.rate = rate;
  speechSynthesis.speak(u);
}
function sayAll(chars, i = 0) {
  if (i >= chars.length) return;
  state.hot = i + 1; drawChart();
  const v = localVoice();
  if (!v) { speak(chars.join('，'), true); return; }
  if (i === 0) { if (current) current.pause(); speechSynthesis.cancel(); }
  const u = new SpeechSynthesisUtterance(chars[i]);
  u.voice = v; u.lang = v.lang; u.rate = 0.7;
  u.onend = () => setTimeout(() => sayAll(chars, i + 1), 350);
  speechSynthesis.speak(u);
}

    ji: { roman: ['ji1', 'ji2', 'ji3', 'ji4', 'ji5', 'ji6'], chars: ['衣', '椅', '意', '儿', '耳', '二'], say: ['衣', '椅', '意', '兒', '耳', '二'], mean: ['clothes', 'chair', 'meaning', 'child', 'ear', 'two'] },
  },
  pairsTitle: 'Pairs people mix up',
  pairs: [
    ['3 vs 6:', 'both flat. 6 sits a little lower, just under your normal voice.', [['試', '试 si3 try'], ['事', '事 si6 thing']]],
    ['2 vs 5:', 'both rise. 2 rises big and high, 5 starts low and only rises a bit.', [['史', '史 si2 history'], ['市', '市 si5 market']]],
    ['4 vs 6:', 'both low. 4 sinks at the end, like a sigh.', [['時', '时 si4 time'], ['事', '事 si6 thing']]],
    ['Short syllables:', 'ones ending in p, t or k are clipped short, and only use tones 1, 3 and 6.', [['色', '色 sik1 colour'], ['錫', '锡 sek3 kiss (slang)'], ['食', '食 sik6 eat']]],
  ],
  cheat: [
    ['j', 'sounds like English <b>y</b>', '有', 'jau5', 'have'],
    ['z', 'between <b>dz</b> and <b>j</b>', '早', 'zou2', 'early'],
    ['c', 'like <b>ts</b> or <b>ch</b>', '茶', 'caa4', 'tea'],
    ['ng', 'the <b>ng</b> in "sing", at the start', '我', 'ngo5', 'I, me'],
    ['gw / kw', 'like <b>Gw</b>en, <b>qu</b>een', '挂', 'gwaa3', 'hang'],
    ['aa', 'long <b>ah</b>', '街', 'gaai1', 'street'],
    ['a', 'short <b>uh</b>, quicker', '鸡', 'gai1', 'chicken'],
    ['eo / oe', '<b>er</b> with rounded lips', '佢', 'keoi5', 'he, she'],
    ['yu', 'say <b>ee</b> with rounded lips', '鱼', 'jyu4', 'fish'],
    ['-p -t -k', 'close your mouth for it, but no puff of air', '食', 'sik6', 'eat'],
    ['m', 'just a hum, a whole syllable', '唔', 'm4', 'not'],
  ],
};
const gset = () => JYUTPING.sets[state.set] || JYUTPING.sets.si;

function chartSVG() {
  const g = JYUTPING, set = gset();
  const W = 340, H = 220, L = 46, R = 300, y = (p) => 196 - (p - 1) * 42;
  const grid = [1, 2, 3, 4, 5].map((p) => `<line class="grid" x1="${L}" x2="${R}" y1="${y(p)}" y2="${y(p)}"/>`).join('');
  const labels = `<text x="6" y="${y(5) + 6}" font-size="17">high</text><text x="6" y="${y(1) + 6}" font-size="17">low</text>`;
  const lines = g.tones.filter((t) => set.chars[t.n - 1]).map((t) => {
    const on = state.hot === t.n ? 'on' : '';
    const tag = (x, yy) => `<text x="${x}" y="${yy}" font-size="24" data-tone="${t.n}" style="cursor:pointer">${t.n}</text>`;
    const p = t.pitch, rises = p[1] > p[0];
    // risers stop short so their labels don't sit on top of the flat tones' labels
    const x1 = L + 14, x2 = rises ? R - 80 : R - 20, off = (t.n === 6 ? 6 : t.n === 4 ? -3 : 0);
    const ya = y(p[0]) + off, yb = y(p[1]) + off;
    const mid = `${(x1 + x2) / 2} ${(ya + yb) / 2 + (p[0] === p[1] ? 0 : rises ? 10 : -6)}`;
    return `<path class="tl ${on}" data-tone="${t.n}" stroke="${t.color}" d="M${x1} ${ya} Q${mid} ${x2} ${yb}"/>${rises ? tag(x2 - 4, yb - 12) : tag(x2 + 12, yb + 8)}`;
  }).join('');
  return `<svg class="tonechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pitch of the ${g.title} tones">${grid}${labels}${lines}</svg>`;
}
function drawChart() { const el = $('#chart'); if (el) { el.innerHTML = chartSVG(); wireChart(); } }
function wireChart() {
  const set = gset();
  document.querySelectorAll('#chart [data-tone]').forEach((el) => el.onclick = () => { const n = +el.dataset.tone; state.hot = n; drawChart(); sayLocal(set.say[n - 1]); });
}

function renderGuide(app) {
  const g = JYUTPING, set = gset(), setKey = Object.keys(g.sets).find((k) => g.sets[k] === set);
  const tones = g.tones.filter((t) => set.chars[t.n - 1]);
  app.innerHTML = `
    <div class="row" style="margin:0 0 8px"><button class="ghost" id="back">← Back</button></div>
    <div class="hero">${D[g.mascot]()}<div><h1>${g.title} <span>101</span></h1>
      <p class="sub">${g.intro}</p></div></div>

    ${localVoice() ? '' : `<div class="voicewarn"><b>Tip for clearer tone samples:</b> ${g.voiceTip}</div>`}

    <div class="card">
      <label class="small">The ${g.count} tones</label>
      <p class="hint" style="margin-top:-4px">Each line is how your voice moves. Tap a line to hear it, or play them all in order.</p>
      <div class="chips" style="margin:8px 0 0">${Object.entries(g.sets).map(([k, v]) => `<button class="chip ${k === setKey ? 'on' : ''}" data-set="${k}">${v.roman.filter(Boolean).join(' ')}</button>`).join('')}</div>
      <div id="chart">${chartSVG()}</div>
      <div class="play" style="margin-top:4px"><button id="playall">▶ Play them all</button>${PAUSE}</div>
      <div class="tones" style="margin-top:12px">${tones.map((t) => `
        <div class="tone" data-say="${set.say[t.n - 1]}" data-n="${t.n}">
          <div class="n"><span class="sw" style="background:${t.color}"></span>Tone ${t.n}</div>
          <div class="hint" style="margin:0">${t.name}, ${t.like}</div>
          <div class="ex">${set.chars[t.n - 1]} <small>${set.roman[t.n - 1]} · ${set.mean[t.n - 1]}</small></div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <label class="small">${g.pairsTitle}</label>
      ${g.pairs.map(([head, body, ex]) => `<div class="pair"><b>${head}</b> ${body}
        <div class="mini">${ex.map(([say, label]) => `<button data-say="${say}">${label}</button>`).join('')}</div></div>`).join('')}
    </div>

    <div class="card">
      <label class="small">Spelling cheat sheet</label>
      <p class="hint" style="margin-top:-4px">The letters that don't sound like English. Tap an example to hear it.</p>
      <table class="cheat">${g.cheat.map(([l, how, zh, jp, mean]) => `
        <tr><td>${l}</td><td>${how}</td><td data-say="${zh}"><span class="zh">${zh}</span> ${jp}<br><span class="hint">${mean}</span></td></tr>`).join('')}
      </table>
    </div>

    <div class="tip">${D.mug()}<div><b>How to practice:</b> pick a word, say it, then tap to compare. Tones are about how your voice <i>moves</i> compared with your normal pitch, not about hitting exact notes.</div></div>
  `;
  $('#back').onclick = () => { state.view = 'main'; state.hot = 0; render(); };
  app.querySelectorAll('[data-set]').forEach((b) => b.onclick = () => { state.set = b.dataset.set; render(); });
  app.querySelectorAll('[data-say]').forEach((el) => el.onclick = () => {
    if (el.dataset.n) { state.hot = +el.dataset.n; drawChart(); }
    sayLocal(el.dataset.say);
  });
  $('#playall').onclick = () => sayAll(tones.map((t) => set.say[t.n - 1]));
  wireChart();
}

async function initialize() {
  render();
  try {
    const response = await fetch('/api/translate');
    if (!response.ok) throw new Error();
    const status = await response.json();
    state.authenticated = status.authenticated;
    state.providerReady = status.providerReady;
  } catch { state.error = 'Could not reach the coach. Try refreshing the page.'; }
  finally { state.connecting = false; render(); }
}
initialize();
</script>
</body>
</html>
